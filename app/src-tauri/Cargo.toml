[package]
name = "grabbit"
version = "2.0.13"
edition = "2021"
description = "Screenshots and screen recordings, straight to the clipboard"
license = "MIT"
authors = ["JakeTheRabbit"]

[lib]
name = "grabbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clipboard-rs = "0.3.5"
cpal = "0.18.2"
device_query = "4.0.1"
dirs = "7.0.0"
fontdb = "0.23"
docx-rs = "0.4.22"
drag = "2"
enigo = "0.6.1"
fs4 = "1.1.0"
hex = "0.4.3"
hmac = "0.13.0"
hound = "3.5.1"
image = "0.25.10"
image-webp = "0.2.4"
log = "0.4.35"
png = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "form"] }
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["full"] }
xcap = "0.9.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Recovery", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSError", "NSValue"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace"] }
objc2-core-foundation = { version = "0.3", features = ["CFData"] }
screencapturekit = "11"

# Pixel loops (capture, crop, encode) are unusable unoptimised; keep our own crate quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
